<!doctype html>
<html lang="th">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emergency Drug Box</title>
    <script src="./config.js"></script>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #687386;
        --line: #dfe4ed;
        --primary: #146c94;
        --primary-2: #0d4f6f;
        --primary-soft: #e7f3f8;
        --ok: #217a57;
        --warn: #a35b00;
        --bad: #b42318;
        --radius: 8px;
        --shadow-sm: 0 1px 2px rgba(23, 32, 51, 0.06);
        --shadow-md: 0 10px 28px rgba(23, 32, 51, 0.09);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, rgba(20, 108, 148, 0.08), transparent 34rem),
          var(--bg);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 7px;
        min-height: 40px;
        padding: 9px 13px;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        transition:
          background 0.12s ease,
          box-shadow 0.12s ease,
          transform 0.12s ease;
      }
      button:hover {
        background: var(--primary-2);
      }
      button:active {
        transform: translateY(1px);
      }
      button.secondary {
        background: #edf2f7;
        color: var(--ink);
      }
      button.secondary:hover {
        background: #dce5ef;
      }
      button.danger {
        background: var(--bad);
      }
      button.ghost {
        background: transparent;
        color: var(--primary);
        padding: 6px 8px;
        min-height: 34px;
      }
      .icon-actions {
        gap: 6px;
        flex-wrap: nowrap;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        min-width: 36px;
        min-height: 36px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        border: 1px solid #d8e2ed;
        border-radius: 9px;
        background: #fff;
        color: var(--primary);
        box-shadow: var(--shadow-sm);
      }
      .icon-btn:hover {
        background: var(--primary-soft);
        border-color: rgba(20, 108, 148, 0.28);
        color: var(--primary-2);
      }
      .icon-btn.danger {
        background: #fff;
        color: var(--bad);
        border-color: #f1c7c4;
      }
      .icon-btn.danger:hover {
        background: #fff1f2;
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(20, 108, 148, 0.22);
        outline-offset: 2px;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        min-height: 40px;
        padding: 9px 10px;
        background: #fff;
        color: var(--ink);
      }
      input[type="checkbox"],
      input[type="radio"] {
        width: auto;
      }
      textarea {
        min-height: 78px;
        resize: vertical;
      }
      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        background: #f8fafc;
      }
      .hidden {
        display: none !important;
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(232px, 260px) minmax(0, 1fr);
      }
      .side {
        background: var(--sidebar, #12384a);
        color: #f8fbfd;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      .brand {
        font-weight: 800;
        font-size: 18px;
        line-height: 1.2;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-logo {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font-weight: 800;
        overflow: hidden;
        flex: none;
      }
      .brand-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .brand small {
        display: block;
        color: #c9d8df;
        font-size: 12px;
        font-weight: 500;
        margin-top: 2px;
      }
      .nav {
        display: grid;
        gap: 7px;
      }
      .nav button {
        text-align: left;
        background: transparent;
        color: #dceaf0;
        border: 1px solid transparent;
        min-height: 42px;
        border-radius: 8px;
      }
      .nav button.active,
      .nav button:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.12);
      }
      .userbox {
        margin-top: auto;
        color: #c9d8df;
        font-size: 13px;
        display: grid;
        gap: 8px;
        text-align: center;
      }
      #currentUser {
        text-align: center;
      }
      .sidebar-credit {
        color: #c9d8df;
        font-size: 12px;
        line-height: 1.45;
        opacity: 0.9;
        text-align: center;
      }
      .locked-field {
        display: grid;
        gap: 8px;
      }
      .locked-field .actions {
        margin-top: -6px;
      }
      .main {
        min-width: 0;
        padding: 24px;
        display: grid;
        gap: 18px;
        align-content: start;
      }
      .topbar {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
      }
      .topbar h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.15;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow-sm);
        overflow: auto;
      }
      .settings-section {
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .settings-section:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .settings-section h3 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      .settings-hint {
        margin-top: -5px;
        color: var(--muted);
        font-size: 12px;
      }
      .color-input {
        min-height: 42px;
        padding: 4px;
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .grid.cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .grid.cols-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .dashboard-kpis {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }
      .stat {
        position: relative;
        overflow: hidden;
        min-height: 118px;
        border: 0;
        border-radius: 8px;
        padding: 14px 12px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 4px;
        color: #fff;
        text-align: center;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
      }
      .stat::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 52%);
        pointer-events: none;
      }
      .stat::after {
        content: "";
        position: absolute;
        right: -42px;
        bottom: -52px;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        pointer-events: none;
      }
      .stat-icon,
      .stat span,
      .stat b,
      .stat small {
        position: relative;
        z-index: 1;
      }
      .stat-icon {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 16px;
        font-weight: 900;
      }
      .stat span {
        color: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.25;
      }
      .stat b {
        font-size: 34px;
        line-height: 1;
        color: #fff;
      }
      .stat small {
        min-height: 16px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 800;
      }
      .stat.blue {
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      }
      .stat.teal {
        background: linear-gradient(135deg, #0e7490 0%, #14b8a6 100%);
      }
      .stat.red {
        background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      }
      .stat.orange {
        background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      }
      .stat.green {
        background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      }
      .stat.purple {
        background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      }
      .dashboard-stack {
        display: grid;
        gap: 14px;
        margin-top: 14px;
      }
      .dashboard-alert-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
        gap: 14px;
      }
      .dashboard-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .dashboard-panel-head h3 {
        margin: 0;
      }
      .dashboard-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        min-height: 28px;
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 12px;
        font-weight: 800;
        background: #2563eb;
        color: #fff;
        box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
      }
      .dashboard-badge.danger {
        background: #ef4444;
        color: #fff;
        box-shadow: 0 6px 14px rgba(239, 68, 68, 0.25);
      }
      .dashboard-badge.warn {
        background: #f59e0b;
        color: #fff;
        box-shadow: 0 6px 14px rgba(245, 158, 11, 0.26);
      }
      .open-alert-list,
      .expiry-watch-list {
        display: grid;
        gap: 10px;
      }
      .open-alert-panel {
        border: 1px solid #ef4444;
        border-top: 5px solid #ef4444;
        background: linear-gradient(180deg, #fff1f2 0, #ffffff 42%);
      }
      .open-alert-card {
        border: 1px solid #ef4444;
        border-left: 8px solid #dc2626;
        border-radius: var(--radius);
        padding: 13px;
        background: linear-gradient(90deg, #fee2e2 0, #fff 62%);
        display: grid;
        gap: 10px;
        box-shadow: 0 10px 22px rgba(239, 68, 68, 0.14);
      }
      .open-alert-top,
      .expiry-watch-row {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
      }
      .alert-symbol,
      .expiry-symbol {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        flex: none;
        font-weight: 900;
      }
      .alert-symbol {
        background: #dc2626;
        color: #fff;
        box-shadow: 0 6px 14px rgba(220, 38, 38, 0.24);
      }
      .expiry-symbol {
        background: #f59e0b;
        color: #fff;
        box-shadow: 0 6px 14px rgba(245, 158, 11, 0.24);
      }
      .open-alert-title,
      .expiry-watch-title {
        font-weight: 850;
        font-size: 15px;
        color: var(--ink);
      }
      .open-alert-meta,
      .expiry-watch-meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .open-alert-detail {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .open-alert-detail div {
        border: 1px solid #fecaca;
        background: #fff;
        border-radius: 7px;
        padding: 8px;
        min-width: 0;
      }
      .open-alert-detail span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .open-alert-detail b {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .open-alert-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }
      .expiry-watch-panel {
        border: 1px solid #f59e0b;
        border-top: 5px solid #f59e0b;
        background: linear-gradient(180deg, #ffedd5 0, #ffffff 46%);
      }
      .expiry-watch-row {
        border: 1px solid #f59e0b;
        border-left: 8px solid #d97706;
        border-radius: var(--radius);
        padding: 10px;
        background: linear-gradient(90deg, #fff3c4 0, #ffffff 68%);
        color: var(--ink);
        font-weight: 400;
        text-align: left;
        min-height: 0;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(245, 158, 11, 0.14);
      }
      .expiry-watch-row:hover {
        background: #ffe8a3;
      }
      .expiry-watch-days {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 8px;
        background: #d97706;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .empty-state {
        border: 1px dashed #94a3b8;
        border-radius: var(--radius);
        padding: 14px;
        color: #334155;
        background: #eef2ff;
        text-align: center;
      }
      .open-alert-panel .empty-state {
        border-color: #ef4444;
        background: #fee2e2;
        color: #991b1b;
      }
      .expiry-watch-panel .empty-state {
        border-color: #f59e0b;
        background: #ffedd5;
        color: #9a3412;
      }
      .box-card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
      }
      .box-card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-top: 5px solid #8aa0b5;
        border-radius: var(--radius);
        background: #fff;
        padding: 15px;
        display: grid;
        gap: 10px;
        min-height: 178px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.09);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          border-color 0.12s ease;
      }
      .box-card:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
        border-color: #c8d2df;
      }
      .box-card.ready {
        border-color: #10b981;
        border-top-color: #059669;
        background: linear-gradient(180deg, #bbf7d0 0, #f0fdf4 44%, #ffffff 100%);
      }
      .box-card.expiring {
        border-color: #f59e0b;
        border-top-color: #d97706;
        background: linear-gradient(180deg, #fed7aa 0, #fff7ed 46%, #ffffff 100%);
      }
      .box-card.opened {
        border-color: #ef4444;
        border-top-color: #dc2626;
        background: linear-gradient(180deg, #fecaca 0, #fff1f2 46%, #ffffff 100%);
      }
      .box-card.ready::before,
      .box-card.expiring::before,
      .box-card.opened::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
      }
      .box-card.ready::before {
        background: #10b981;
      }
      .box-card.expiring::before {
        background: #f59e0b;
      }
      .box-card.opened::before {
        background: #ef4444;
      }
      .box-card-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: start;
      }
      .box-card-title {
        font-weight: 800;
        font-size: 18px;
      }
      .box-card-meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .box-card-list {
        display: grid;
        gap: 5px;
        font-size: 13px;
      }
      .box-card-line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        border-radius: 6px;
        padding: 4px 6px;
        background: #fff;
        border: 1px solid rgba(148, 163, 184, 0.95);
      }
      .box-card-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        padding-top: 2px;
      }
      .box-card-actions button {
        min-width: 34px;
        min-height: 32px;
        padding: 5px 8px;
      }
      .qr-preview {
        display: grid;
        justify-items: center;
        gap: 10px;
        text-align: center;
      }
      .qr-preview img {
        width: 220px;
        height: 220px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px;
        background: #fff;
      }
      .muted {
        color: var(--muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        border-radius: 99px;
        padding: 2px 9px;
        font-size: 12px;
        font-weight: 850;
        background: #475569;
        color: #fff;
      }
      .pill.ok {
        background: #16a34a;
        color: #fff;
      }
      .pill.warn {
        background: #f97316;
        color: #fff;
      }
      .pill.bad {
        background: #ef4444;
        color: #fff;
      }
      .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at top right, rgba(20, 108, 148, 0.16), transparent 30rem),
          linear-gradient(135deg, #eef6f7, #f8f1ea);
      }
      .login .panel {
        width: min(420px, 100%);
        box-shadow: var(--shadow-md);
      }
      .login h1 {
        margin: 0 0 4px;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(10, 20, 30, 0.45);
        display: grid;
        place-items: start center;
        padding: 28px 14px;
        overflow: auto;
        z-index: 10;
      }
      .modal {
        width: min(960px, 100%);
        background: #fff;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        padding: 16px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      .modal-head h2 {
        margin: 0;
        font-size: 20px;
      }
      .sweet-modal {
        width: min(420px, 100%);
        text-align: center;
        padding: 24px;
        border-radius: 12px;
      }
      .sweet-icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 12px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--primary-soft);
        color: var(--primary);
      }
      .sweet-icon svg {
        width: 30px;
        height: 30px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .sweet-modal h2 {
        margin: 0;
        font-size: 22px;
      }
      .sweet-modal p {
        margin: 6px 0 16px;
        color: var(--muted);
      }
      .sweet-form {
        display: grid;
        gap: 10px;
        text-align: left;
      }
      .sweet-form .actions {
        justify-content: center;
        margin-top: 6px;
      }
      .app-dialog {
        width: min(440px, 100%);
        padding: 22px;
        border-radius: 14px;
        text-align: center;
      }
      .app-dialog h2 {
        margin: 0;
        font-size: 21px;
      }
      .app-dialog-message {
        margin: 8px 0 16px;
        color: var(--muted);
        line-height: 1.55;
      }
      .app-dialog-input {
        text-align: left;
        margin: 12px 0 16px;
      }
      .app-dialog .actions {
        justify-content: center;
      }
      .item-row {
        display: grid;
        grid-template-columns: 1.6fr 1fr 0.8fr 0.8fr 0.7fr 0.6fr auto;
        gap: 8px;
        align-items: end;
        margin-bottom: 8px;
      }
      .kit-item-row {
        grid-template-columns: 1.7fr 1.1fr 0.7fr 0.7fr auto;
      }
      .box-item-row {
        grid-template-columns: 1.5fr 0.95fr 0.8fr 0.9fr 0.65fr 0.62fr 0.7fr auto auto;
      }
      .box-lot-row {
        grid-template-columns: 0.9fr 0.9fr auto;
        max-width: 520px;
        margin-left: auto;
        padding: 8px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }
      .lot-add-btn {
        width: 38px;
        min-width: 38px;
        padding: 0;

      const navItems = [
        ["dashboard", "Dashboard"],
        ["boxes", "กล่องยา"],
        ["kits", "ชุดมาตรฐาน"],
        ["reports", "รายงาน"],
        ["settings", "ตั้งค่า"],
        ["users", "ผู้ใช้"],
      ];
      const INSPECTION_PRINT_SETTINGS_KEY = "edb_inspection_print_settings";
      const DRUG_RECORD_PRINT_SETTINGS_KEY = "edb_drug_record_print_settings_v2";
      let creditEditUnlocked = false;
      let creditEditPin = "";
      let settingsPreview = null;
      let surveySummaryLoading = false;
      let liveRefreshTimer = null;
      let liveRefreshBusy = false;
      let lastOpenEventId = "";
      document.addEventListener("DOMContentLoaded", init);

      function persistedSettings_() {
        return (state.data && state.data.settings) || publicSettings || {};
      }

      function loginUsers_() {
        return (state.data && state.data.loginUsers) || [];
      }

      function setLoginUsers_(users) {
        state.data = state.data || {};
        state.data.loginUsers = Array.isArray(users) ? users : [];
      }

      function loginUserLabel_(user) {
        if (user.displayText) return user.displayText;
        const name = user.displayName || user.username || "";
        return user.position ? `${name}, ${user.position}` : name;
      }

      function loginUserOptionsHtml_(selected = "") {
        const users = loginUsers_();
        if (!users.length) {
          const fallback = selected || "admin";
          return `<option value="${attr(fallback)}">${esc(fallback)}</option>`;
        }
        return users
          .map(
            (user) =>
              `<option value="${attr(user.username)}" ${user.username === selected ? "selected" : ""}>${esc(loginUserLabel_(user))}</option>`,
          )
          .join("");
      }

      function updateLoginUserSelect_(selected = "") {
        ["loginUsername", "alertLoginUsername"].forEach((id) => {
          const select = byId(id);
          if (!select) return;
          select.innerHTML = loginUserOptionsHtml_(selected || select.value);
        });
      }

      async function ensureLoginUsersLoaded_() {
        if (loginUsers_().length > 1) return;
        try {
          const res = await server("apiLoginUsers");
          setLoginUsers_((res && res.loginUsers) || []);
          updateLoginUserSelect_();
        } catch (err) {
          console.warn("Cannot load login users", err);
        }
      }

      function activeSettings_() {
        return settingsPreview || persistedSettings_();
      }

      function settingValue_(key, fallback = "") {
        const settings = activeSettings_();
        const value = settings[key];
        return value === undefined || value === null || value === ""
          ? fallback
          : value;
      }

      function settingList_(key, fallback) {
        return String(settingValue_(key, fallback || ""))
          .split(/\n|\|/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function settingColor_(key, fallback) {
        const value = String(settingValue_(key, fallback || "")).trim();
        return /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
      }

      function applyThemeSettings(settings = activeSettings_()) {
        const root = document.documentElement;
        const vars = {
          "--primary": settings.THEME_PRIMARY || "#146c94",
          "--primary-2": settings.THEME_PRIMARY_DARK || "#0d4f6f",
          "--sidebar": settings.THEME_SIDEBAR || "#12384a",
          "--public-bg-start": settings.THEME_PUBLIC_BG_1 || "#183f8f",
          "--public-bg-mid": settings.THEME_PUBLIC_BG_2 || "#215fe1",
          "--public-bg-end": settings.THEME_PUBLIC_BG_3 || "#083a91",
          "--public-top": settings.THEME_PUBLIC_TOP || "#1f3f73",
          "--public-items-top": settings.THEME_PUBLIC_ITEMS_TOP || "#059669",
          "--public-hero-start": settings.THEME_PUBLIC_HERO_1 || "#2558c7",
          "--public-hero-end": settings.THEME_PUBLIC_HERO_2 || "#1d6df2",
        };
        Object.entries(vars).forEach(([key, value]) =>
          root.style.setProperty(key, value),
        );
        const baseSize = Number(settings.APP_BASE_FONT_SIZE || 14);
        const scale = Number(settings.APP_FONT_SCALE || 100) / 100;
        document.body.style.fontSize =
          Math.max(12, Math.min(20, baseSize * scale)) + "px";
      }

      function appLogoHtml_(settings = activeSettings_()) {
        const logoUrl = String(settings.APP_LOGO_URL || "").trim();
        const logoText = settings.APP_LOGO_TEXT || "+";
        return logoUrl
          ? '<span class="brand-logo"><img src="' +
              attr(logoUrl) +
              '" alt="logo"></span>'
          : '<span class="brand-logo">' + esc(logoText) + "</span>";
      }

      function brandHtml_() {
        const title = settingValue_("APP_DISPLAY_NAME", "Smart Emergency Box");
        const shortName = settingValue_("APP_SHORT_NAME", "SEB");
        return (
          appLogoHtml_() +
          "<span>" +
          esc(title) +
          "<small>" +
          esc(shortName) +
          "</small></span>"
        );
      }

      function updateBrand_() {
        const brand = byId("brandBox");
        if (brand) brand.innerHTML = brandHtml_();
      }

      function updateDocumentTitle_(settings = activeSettings_()) {
        document.title = String(
          (settings && settings.LABEL_FOOTER) || "Emergency Drug Box",
        );
      }

      function updateSidebarCredit_() {
        const credit = byId("sidebarCredit");
        if (!credit) return;
        credit.textContent = settingValue_(
          "APP_CREDIT_TEXT",
          "Developed by Natee I.,Pharm D.",
        );
      }

      function navLabel_(key, fallback) {
        const map = {
          dashboard: "NAV_DASHBOARD_LABEL",
          boxes: "NAV_BOXES_LABEL",
          kits: "NAV_KITS_LABEL",
          reports: "NAV_REPORTS_LABEL",
          settings: "NAV_SETTINGS_LABEL",
          users: "NAV_USERS_LABEL",
        };
        return settingValue_(map[key], fallback);
      }

      function optionHtml_(options, selected) {
        return options
          .map(
            (item) =>
              '<option value="' +
              attr(item) +
              '" ' +
              (item === selected ? "selected" : "") +
              ">" +
              esc(item) +
              "</option>",
          )
          .join("");
      }

      function settingField_(
        key,
        label,
        type = "text",
        fallback = "",
        extra = "",
      ) {
        return (
          "<label>" +
          esc(label) +
          '<input data-setting="' +
          attr(key) +
          '" id="set' +
          attr(key) +
          '" type="' +
          attr(type) +
          '" ' +
          extra +
          ' value="' +
          attr(settingValue_(key, fallback)) +
          '"></label>'
        );
      }

      function settingSelect_(key, label, options, fallback = "") {
        const current = settingValue_(key, fallback);
        return (
          "<label>" +
          esc(label) +
          '<select data-setting="' +
          attr(key) +
          '" id="set' +
          attr(key) +
          '">' +
          options
            .map(
              (option) =>
                '<option value="' +
                attr(option.value) +
                '" ' +
                (option.value === current ? "selected" : "") +
                ">" +
                esc(option.label) +
                "</option>",
            )
            .join("") +
          "</select></label>"
        );
      }

      function settingTextarea_(key, label, fallback = "") {
        return (
          "<label>" +
          esc(label) +
          '<textarea data-setting="' +
          attr(key) +
          '" id="set' +
          attr(key) +
          '">' +
          esc(settingValue_(key, fallback)) +
          "</textarea></label>"
        );
      }

      function settingsColorField_(key, label, fallback) {
        return (
          "<label>" +
          esc(label) +
          '<input class="color-input" data-setting="' +
          attr(key) +
          '" id="set' +
          attr(key) +
          '" type="color" value="' +
          attr(settingColor_(key, fallback)) +
          '"></label>'
        );
      }

      function creditSettingField_() {
        const disabled = creditEditUnlocked ? "" : "disabled";
        return (
          '<div class="locked-field"><label>Credit ใต้ปุ่มออกจากระบบ' +
          '<input data-setting="APP_CREDIT_TEXT" id="setAPP_CREDIT_TEXT" type="text" ' +
          disabled +
          ' value="' +
          attr(settingValue_("APP_CREDIT_TEXT", "Developed by Natee I.,Pharm D.")) +
          '"></label><div class="actions"><button class="secondary" type="button" onclick="unlockCreditEdit()">แก้ไข Credit</button></div></div>'
        );
      }

      async function unlockCreditEdit() {
        const pin = await appPrompt_("รหัสยืนยัน", "", {
          inputType: "password",
          confirmText: "ยืนยัน",
        });
        if (pin === null) return;
        if (pin !== "2222") return toast("รหัสไม่ถูกต้อง");
        creditEditUnlocked = true;
        creditEditPin = pin;
        const input = byId("setAPP_CREDIT_TEXT");
        if (input) input.disabled = false;
        toast("แก้ไข Credit ได้แล้ว");
      }

      function collectSettingsPayload_() {
        const payload = {};
        document.querySelectorAll("[data-setting]").forEach((input) => {
          payload[input.dataset.setting] = input.value;
        });
        return payload;
      }

      function applySettingsPreview_() {
        if (state.page !== "settings") return;
        settingsPreview = {
          ...persistedSettings_(),
          ...collectSettingsPayload_(),
        };
        applyThemeSettings(settingsPreview);
        updateBrand_();
        updateDocumentTitle_(settingsPreview);
        updateSidebarCredit_();
        renderNav();
        const title = byId("pageTitle");
        if (title) title.textContent = navLabel_(state.page, title.textContent);
      }

      function bindSettingsLivePreview_() {
        document.querySelectorAll("[data-setting]").forEach((input) => {
          input.addEventListener("input", applySettingsPreview_);
          input.addEventListener("change", applySettingsPreview_);
        });
        applySettingsPreview_();
      }

      async function server(name, ...args) {
        if (!API_URL) {
          throw new Error("ยังไม่ได้ตั้งค่า SEB_API_URL หรือ SEB_SUPABASE_URL");
        }
        let res;
        try {
          res = await fetch(API_URL, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              apikey: SUPABASE_ANON_KEY,
              authorization: SUPABASE_ANON_KEY ? "Bearer " + SUPABASE_ANON_KEY : "",
            },
            body: JSON.stringify({ action: name, args }),
          });
        } catch (err) {
          throw new Error(
            "เชื่อมต่อ Supabase Edge Function ไม่ได้: ตรวจว่า deploy function ชื่อ api แล้ว และ URL/Anon key ใน config.js ถูกต้อง",
          );
        }
        const payload = await res.json().catch(() => ({}));
        if (!res.ok || payload.error) {
          throw new Error(payload.error || payload.message || "API request failed");
        }
        return payload.data;
      }

      async function init() {
        if (BOOT.page === "open" && BOOT.boxId) return renderPublicOpen();
        if (BOOT.page === "survey") return renderPublicSurvey();
        try {
          const res = await server("apiBootstrap", state.token);
          if (res.authenticated) {
            state.user = res.user;
            state.data = res.data;
            state.appUrl = res.appUrl;
            showApp();
          } else {
            state.user = null;
            state.data = res.data;
            state.appUrl = res.appUrl;
            showApp();
          }
        } catch (err) {
          showLogin();
          toast(err.message || err);
        }
      }

      async function login() {
        return performLogin_(val("loginUsername"), byId("loginPassword").value);
      }

      async function loginFromAlert() {
        return performLogin_(
          val("alertLoginUsername"),
          byId("alertLoginPassword").value,
        );
      }

      function handleLoginEnter(event, source) {
        if (event.key !== "Enter") return;
        event.preventDefault();
        return source === "alert" ? loginFromAlert() : login();
      }

      async function performLogin_(username, password) {
        try {
          const res = await server(
            "apiLogin",
            username,
            password,
          );
          state.token = res.token;
          state.user = res.user;
          state.data = res.data;
          state.appUrl = res.appUrl;
          localStorage.setItem("edb_token", state.token);
          updateLoginUserSelect_(state.user.username);
          closeModal();
          if (!canAccessPage(state.page)) state.page = "dashboard";
          showApp();
        } catch (err) {
          toast(err.message || err);
        }
      }

      async function logout() {
        try {
          await server("apiLogout", state.token);
        } catch (err) {}
        localStorage.removeItem("edb_token");
        state.token = "";
        state.user = null;
        state.data = null;
        settingsPreview = null;
        await init();
      }

      async function refresh() {
        if (!state.token) {
          const res = await server("apiBootstrap", "");
          state.data = res.data;
          state.user = null;
          state.appUrl = res.appUrl;
          applyThemeSettings();
          updateBrand_();
          updateSidebarCredit_();
          renderNav();
          renderPage();
          return;
        }
        const res = await server("apiRefresh", state.token);
        state.data = res.data;
        state.user = res.user;
        state.appUrl = res.appUrl;
        applyThemeSettings();
        updateBrand_();
        updateSidebarCredit_();
        renderNav();
        renderPage();
      }

      function startLiveRefresh_() {
        stopLiveRefresh_();
        if (BOOT.page === "open" || BOOT.page === "survey") return;
        liveRefreshTimer = setInterval(liveRefreshDashboard_, 2000);
      }

      function stopLiveRefresh_() {
        if (!liveRefreshTimer) return;
        clearInterval(liveRefreshTimer);
        liveRefreshTimer = null;
      }

      async function liveRefreshDashboard_() {
        if (liveRefreshBusy || !state.data) return;
        if (!["dashboard", "reports", "boxes", "boxDetail"].includes(state.page)) return;
        if (state.page === "boxDetail" && boxEditorShouldDeferLiveRefresh_()) return;
        liveRefreshBusy = true;
        try {
          const res = await server("apiLiveDashboard", state.token || "");
          const prevLatest = latestOpenEventId_();
          state.data = { ...state.data, ...res.data };
          if (res.user !== undefined) state.user = res.user || null;
          state.appUrl = res.appUrl || state.appUrl;
          applyThemeSettings();
          updateBrand_();
          updateSidebarCredit_();
          renderNav();
          renderPage();
          const nextLatest = latestOpenEventId_();
          if (prevLatest && nextLatest && prevLatest !== nextLatest) {
            toast("มีการเปิดกล่องยาใหม่");
          }
        } catch (err) {
          console.warn(err);
        } finally {
          liveRefreshBusy = false;
        }
      }

      function latestOpenEventId_() {
        const events = (state.data && state.data.events) || [];
        return events.length ? String(events[0].id || events[0].openedAt || "") : "";
      }

      function boxEditorShouldDeferLiveRefresh_() {
        if (state.page !== "boxDetail" || !byId("boxItems")) return false;
        const active = document.activeElement;
        if (
          active &&
          byId("content") &&
          byId("content").contains(active) &&
          ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName)
        ) {
          return true;
        }
        const box = state.data.boxes.find((item) => item.id === state.selectedBoxId);
        if (!box) return false;
        const payload = {
          id: box.id,
          boxCode: val("boxCode"),
          kitId: val("boxKitId"),
          kitName: selectedBoxKit_() ? selectedBoxKit_().name : "",
          location: val("boxLocation"),
          note: val("boxNote"),
          items: collectBoxItems(),
        };
        return boxEditorChanged_(box, payload);
      }

      function refreshInBackground(message) {
        refresh()
          .then(() => {
            if (message) toast(message);
          })
          .catch((err) => toast(err.message || err));
      }

      function loadSurveySummaryInBackground() {
        if (
          surveySummaryLoading ||
          !state.data ||
          state.data.surveySummary
        )
          return;
        surveySummaryLoading = true;
        server("apiGetSurveySummary", state.token)
          .then((summary) => {
            if (!state.data) return;
            state.data.surveySummary = summary;
            if (state.page === "reports") renderReports();
          })
          .catch((err) => toast(err.message || err))
          .finally(() => {
            surveySummaryLoading = false;
          });
      }

      function showLogin() {
        if (state.data) {
          byId("loginPage").classList.add("hidden");
          byId("publicPage").classList.add("hidden");
          byId("appPage").classList.remove("hidden");
          openLoginAlert();
          return;
        }
        byId("loginPage").classList.remove("hidden");
        byId("appPage").classList.add("hidden");
        byId("publicPage").classList.add("hidden");
        updateLoginUserSelect_();
        ensureLoginUsersLoaded_();
        byId("loginUsername").focus();
      }

      function openLoginAlert() {
        byId("modalRoot").classList.remove("hidden");
        byId("modalRoot").innerHTML =
          `<div class="modal-backdrop"><div class="modal sweet-modal"><div class="sweet-icon">${iconSvg_("power")}</div><h2>เข้าสู่ระบบ</h2><p>กรุณาเข้าสู่ระบบก่อนใช้งานเมนูนี้</p><div class="sweet-form"><label>User<select id="alertLoginUsername" autocomplete="username" onkeydown="handleLoginEnter(event, 'alert')">${loginUserOptionsHtml_(val("loginUsername") || "admin")}</select></label><label>Password<input id="alertLoginPassword" type="password" autocomplete="current-password" value="" onkeydown="handleLoginEnter(event, 'alert')"></label><div class="actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button onclick="loginFromAlert()">เข้าสู่ระบบ</button></div></div></div></div>`;
        ensureLoginUsersLoaded_();
        setTimeout(() => byId("alertLoginUsername").focus(), 0);
      }

      function showApp() {
        byId("loginPage").classList.add("hidden");
        byId("publicPage").classList.add("hidden");
        byId("appPage").classList.remove("hidden");
        byId("currentUser").innerHTML = state.user
          ? `${esc(userDisplayText(state.user))}<br><span class="muted">${esc(roleLabel(state.user.role))}</span>`
          : `<span class="muted">Public Dashboard</span>`;
        const logoutButton = byId("logoutButton");
        if (logoutButton) logoutButton.textContent = state.user ? "ออกจากระบบ" : "เข้าสู่ระบบ";
        applyThemeSettings();
        updateBrand_();
        updateDocumentTitle_();
        updateSidebarCredit_();
        renderNav();
        renderPage();
        lastOpenEventId = latestOpenEventId_();
        startLiveRefresh_();
      }

      function renderNav() {
        byId("nav").innerHTML = navItems
          .filter(
            ([key]) =>
              !state.user ||
              state.user.role === "admin" ||
              (key !== "settings" && key !== "users"),
          )
          .map(
            ([key, label]) =>
              `<button class="${state.page === key || (state.page === "boxDetail" && key === "boxes") ? "active" : ""}" onclick="go('${key}')">${esc(navLabel_(key, label))}</button>`,
          )
          .join("");
      }

      function go(page) {
        if (!state.user && page !== "dashboard") {
          state.page = page;
          showLogin();
          toast("กรุณาเข้าสู่ระบบก่อนใช้งานหน้านี้");
          return;
        }
        if (!canAccessPage(page)) page = "dashboard";
        if (state.page === "settings" && page !== "settings") {
          settingsPreview = null;
          applyThemeSettings();
          updateBrand_();
          updateSidebarCredit_();
        }
        if (page !== "boxDetail") state.selectedBoxId = "";
        state.page = page;
        renderNav();
        renderPage();
      }

      function canAccessPage(page) {
        if (page === "dashboard") return !!state.data;
        if (!state.user) return false;
        return (
          state.user &&
          (state.user.role === "admin" ||
            (page !== "settings" && page !== "users"))
        );
      }

      function renderPage() {
        if (!canAccessPage(state.page)) state.page = "dashboard";
        const titleMap = {
          dashboard: "Dashboard",
          boxes: navLabel_("boxes", "กล่องยา"),
          kits: navLabel_("kits", "ชุดยามาตรฐาน"),
          reports: navLabel_("reports", "รายงาน"),
          settings: navLabel_("settings", "ตั้งค่า"),
          users: navLabel_("users", "ผู้ใช้"),
        };
        const selectedBox =
          state.page === "boxDetail"
            ? state.data.boxes.find((box) => box.id === state.selectedBoxId)
            : null;
        byId("pageTitle").textContent =
          selectedBox ? `แก้ไขกล่อง ${selectedBox.boxCode}` : titleMap[state.page] || "Dashboard";
        byId("pageActions").innerHTML = "";
        if (state.page === "dashboard") renderDashboard();
        if (state.page === "boxes") renderBoxes();
        if (state.page === "boxDetail") renderBoxEditorPage();
        if (state.page === "kits") renderKits();
        if (state.page === "reports") renderReports();
        if (state.page === "settings") renderSettings();
        if (state.page === "users") renderUsers();
      }

      function renderDashboard() {
        const s = state.data.stats;
        const openAlerts = dashboardOpenAlerts_();
        const expiryWatch = dashboardExpiringUnderMonth_();
        const expiredItems = dashboardExpiredItems_();
        const boxCards = state.data.boxes.map(renderBoxCard).join("");
        byId("content").innerHTML = `
        <div class="grid dashboard-kpis">
          ${stat("กล่องยาทั้งหมด", s.totalBoxes, "blue", "□", "กล่อง")}
          ${stat("พร้อมใช้", s.readyBoxes, "green", "✓", "กล่อง")}
          ${stat("เปิดใช้งานอยู่", s.openedBoxes, "teal", "•", "รอตรวจสอบ")}
          ${stat("ยาหมดอายุ", expiredItems.length, "red", "!", "รายการ")}
          ${stat("ใกล้หมดอายุ", expiryWatch.length, "orange", "⌛", "ภายใน 1 เดือน")}
          ${stat("รายการแจ้งเตือน", openAlerts.length, "purple", "▲", "รอรับทราบ")}
        </div>
        <div class="dashboard-stack">
          <div class="dashboard-alert-grid">
            ${renderOpenAlerts_(openAlerts)}
            ${renderExpiryWatch_(expiryWatch)}
          </div>
          <div class="panel"><div class="dashboard-panel-head"><h3>สถานะกล่องยา</h3><span class="dashboard-badge">${s.totalBoxes}</span></div><div class="box-card-grid">${boxCards || '<div class="muted">ยังไม่มีข้อมูลกล่องยา</div>'}</div></div>
        </div>`;
      }

      function dashboardOpenAlerts_() {
        return (state.data.events || [])
          .filter((event) => !event.acknowledgedAt)
          .map((event) => ({ ...event, box: dashboardBoxFor_(event.boxId) }))
          .slice(0, 8);
      }

      function dashboardExpiringUnderMonth_() {
        return (state.data.expiringItems || [])
          .filter((item) => isWithinOneMonth(item.expiryDate))
          .map((item) => ({
            ...item,
            box: item.box || dashboardBoxFor_(item.boxId),
            daysLeft: daysUntil_(item.expiryDate),
          }))
          .sort((a, b) => a.daysLeft - b.daysLeft)
          .slice(0, 10);
      }

      function dashboardExpiredItems_() {
        return (state.data.expiringItems || [])
          .map((item) => ({
            ...item,
            box: item.box || dashboardBoxFor_(item.boxId),
            daysLeft: daysUntil_(item.expiryDate),
          }))
          .filter((item) => item.daysLeft < 0)
          .sort((a, b) => a.daysLeft - b.daysLeft)
          .slice(0, 10);
      }

      function dashboardBoxFor_(boxId) {
        return (state.data.boxes || []).find((box) => box.id === boxId) || null;
      }

      function renderOpenAlerts_(alerts) {

        }
        try {
          const res = await server("apiAcknowledgeOpenEvent", state.token, eventId);
          const event = res.event || {};
          state.data.events = (state.data.events || []).map((item) =>
            item.id === eventId ? { ...item, ...event } : item,
          );
          toast("รับทราบการเปิดกล่องแล้ว");
          renderDashboard();
        } catch (err) {
          toast(err.message || err);

      function autoBoxStatus_(box) {
        if (!box) return "ไม่พร้อมใช้";

        const incomplete = items.some((item) => !item.expiryDate || Number(item.qty || 0) <= 0);
        return incomplete ? "ไม่พร้อมใช้" : "พร้อมใช้";

      function buildResearchAnalytics_() {
        const boxes = state.data.boxes || [];
        const events = state.data.events || [];
        const allItems = boxes.flatMap((box) =>
          (box.items || []).map((item) => ({ ...item, box })),
        );
        const today = startOfDay_(new Date());
        const expiryBuckets = {
          "หมดอายุแล้ว": 0,
          "ภายใน 30 วัน": 0,
          "31-90 วัน": 0,
          "มากกว่า 90 วัน/ไม่ระบุ": 0,
        };
        allItems.forEach((item) => {
          const d = parseClientDate_(item.expiryDate);
          if (!d) expiryBuckets["มากกว่า 90 วัน/ไม่ระบุ"] += 1;
          else {
            const days = Math.ceil((startOfDay_(d) - today) / 86400000);
            if (days < 0) expiryBuckets["หมดอายุแล้ว"] += 1;
            else if (days <= 30) expiryBuckets["ภายใน 30 วัน"] += 1;
            else if (days <= 90) expiryBuckets["31-90 วัน"] += 1;
            else expiryBuckets["มากกว่า 90 วัน/ไม่ระบุ"] += 1;
          }
        });
        const inspectionBuckets = {
          "เลยนัดตรวจ": 0,
          "ภายใน 30 วัน": 0,
          "มากกว่า 30 วัน": 0,
          "ยังไม่ได้นัด": 0,
        };
        boxes.forEach((box) => {
          const d = parseClientDate_(box.inspectionDate);
          if (!d) inspectionBuckets["ยังไม่ได้นัด"] += 1;
          else {
            const days = Math.ceil((startOfDay_(d) - today) / 86400000);
            if (days < 0) inspectionBuckets["เลยนัดตรวจ"] += 1;
            else if (days <= 30) inspectionBuckets["ภายใน 30 วัน"] += 1;
            else inspectionBuckets["มากกว่า 30 วัน"] += 1;
          }
        });
        return {
          totalOpens: events.length,
          uniqueHn: new Set(
            events.map((ev) => String(ev.hn || "").trim()).filter(Boolean),
          ).size,
          readyBoxes: boxes.filter((box) => autoBoxStatus_(box) === "พร้อมใช้").length,
          expiryRiskTotal:
            expiryBuckets["หมดอายุแล้ว"] +
            expiryBuckets["ภายใน 30 วัน"] +
            expiryBuckets["31-90 วัน"],
          totalDrugItems: allItems.length,
          opensByMonth: normalizeMonthSeries_(
            countBy_(events, (ev) => monthKey_(ev.openedAt)),
            12,
          ),
          statusSegments: objectToSegments_(
            countBy_(boxes, (box) => autoBoxStatus_(box) || "ไม่ระบุ"),
            ["#217a57", "#b42318", "#a35b00", "#687386"],
          ),
          expirySegments: objectToSegments_(expiryBuckets, [
            "#b42318",
            "#e07a5f",
            "#f59e0b",
            "#217a57",
          ]),
          inspectionSegments: objectToSegments_(inspectionBuckets, [
            "#b42318",
            "#f59e0b",
            "#146c94",
            "#687386",
          ]),
          topBoxes: topCounts_(
            countBy_(events, (ev) => ev.boxCode || "ไม่ระบุ"),
            8,
          ),
          departmentCounts: topCounts_(
            countBy_(events, (ev) => cleanGroup_(ev.department)),
            8,
          ),
          reasonCounts: topCounts_(
            countBy_(events, (ev) => cleanGroup_(ev.reason)),
            8,
          ),
          topDrugQty: topCounts_(
            sumBy_(
              allItems,
              (item) =>
                [item.drugName, item.strength].filter(Boolean).join(" ") ||
                "ไม่ระบุ",
              (item) => Number(item.qty || 0),
            ),
            8,
          ),
        };
      }

      function researchKpi_(label, value) {
        return `<div class="research-kpi"><span>${esc(label)}</span><b>${esc(value || 0)}</b></div>`;
      }
      function researchCard_(title, sub, body) {
        return `<div class="research-card"><div><h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div></div>${body}</div>`;
      }
      function renderBarChart_(rows, labelTitle, valueTitle) {
        if (!rows.length)
          return `<div class="muted">ยังไม่มีข้อมูลเพียงพอสำหรับกราฟนี้</div>`;
        const max = Math.max(...rows.map((row) => Number(row.value || 0)), 1);
        return `<div class="chart-bars">${rows
          .map((row) => {
            const pct = Math.max(
              2,
              Math.round((Number(row.value || 0) / max) * 100),
            );
            return `<div class="chart-row" title="${attr(labelTitle)}: ${attr(row.label)} | ${attr(valueTitle)}: ${attr(row.value)}"><div class="chart-label">${esc(row.label)}</div><div class="chart-track"><div class="chart-fill" style="--pct:${pct}%"></div></div><div class="chart-value">${esc(row.value)}</div></div>`;
          })
          .join("")}</div>`;
      }
      function renderDonutChart_(segments) {
        const total = segments.reduce(
          (sum, item) => sum + Number(item.value || 0),
          0,
        );
        if (!total)
          return `<div class="muted">ยังไม่มีข้อมูลเพียงพอสำหรับกราฟนี้</div>`;
        let acc = 0;
        const stops = segments
          .map((item) => {
            const start = acc;
            acc += (Number(item.value || 0) / total) * 100;
            return `${item.color} ${start.toFixed(2)}% ${acc.toFixed(2)}%`;
          })
          .join(", ");
        return `<div class="chart-donut-wrap"><div class="chart-donut" style="--segments: conic-gradient(${stops})"></div><div class="chart-legend">${segments.map((item) => `<div class="legend-row"><span class="legend-main"><i class="legend-dot" style="--c:${item.color}"></i><span>${esc(item.label)}</span></span><b>${esc(item.value)}</b></div>`).join("")}</div></div>`;
      }
      function countBy_(rows, keyFn) {
        return rows.reduce((acc, row) => {
          const key = keyFn(row) || "ไม่ระบุ";
          acc[key] = (acc[key] || 0) + 1;
          return acc;
        }, {});
      }
      function sumBy_(rows, keyFn, valueFn) {
        return rows.reduce((acc, row) => {
          const key = keyFn(row) || "ไม่ระบุ";
          acc[key] = (acc[key] || 0) + Number(valueFn(row) || 0);
          return acc;
        }, {});
      }
      function topCounts_(obj, limit) {
        return Object.keys(obj)
          .map((label) => ({ label, value: obj[label] }))
          .sort((a, b) => Number(b.value) - Number(a.value))
          .slice(0, limit);
      }
      function objectToSegments_(obj, colors) {
        return Object.keys(obj).map((label, idx) => ({
          label,
          value: obj[label],
          color: colors[idx % colors.length],
        }));
      }
      function normalizeMonthSeries_(obj, limit) {
        return Object.keys(obj)
          .sort()
          .slice(-limit)
          .map((label) => ({ label, value: obj[label] }));
      }
      function cleanGroup_(value) {
        const text = String(value || "").trim();
        return text || "ไม่ระบุ";
      }
      function monthKey_(value) {
        const d = parseClientDate_(value);
        if (!d) return "ไม่ระบุ";
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      }
      function parseClientDate_(value) {
        if (!value) return null;
        const d = new Date(value);
        return isNaN(d) ? null : d;
      }
      function startOfDay_(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        return d;
      }

      async function saveBox(id) {
        try {
          if (!validateBoxItemsComplete()) return;
          const box = state.data.boxes.find((b) => b.id === id);
          if (!box) return toast("ไม่พบกล่องยา");
          const payload = {
            id,
            boxCode: val("boxCode"),
            kitId: val("boxKitId"),
            kitName: selectedBoxKit_() ? selectedBoxKit_().name : "",
            location: val("boxLocation"),
            note: val("boxNote"),
            items: collectBoxItems(),
          };
          if (boxEditorChanged_(box, payload)) {
            const reason = await boxChangeReasonDialog_();
            if (!reason) return;
            payload.changeReason = reason;
          }
          await server("apiSaveBox", state.token, payload);
          closeModal();
          toast("บันทึกกล่องแล้ว");
          refreshInBackground("อัปเดตข้อมูลล่าสุดแล้ว");
        } catch (err) {
          toast(err.message || err);
        }
      }

      function boxEditorChanged_(box, payload) {
        return JSON.stringify(boxComparable_(box)) !== JSON.stringify(boxComparable_(payload));
      }

      function boxComparable_(box) {
        return {
          boxCode: String((box && box.boxCode) || "").trim(),
          kitId: String((box && box.kitId) || "").trim(),
          kitName: String((box && box.kitName) || "").trim(),
          location: String((box && box.location) || "").trim(),
          note: String((box && box.note) || "").trim(),
          items: normalizeBoxItemsForCompare_((box && box.items) || []),
        };
      }

      function normalizeBoxItemsForCompare_(items) {
        return (items || [])
          .map((item) => ({
            drugName: String(item.drugName || "").trim(),
            strength: String(item.strength || "").trim(),
            form: String(item.form || "").trim(),
            lot: String(item.lot || "").trim(),
            expiryDate: toInputDate(item.expiryDate),
            qty: Number(item.qty || 0),
            requiredQty: Number(item.requiredQty || item.qty || 0),
            unit: String(item.unit || "").trim(),
          }))
          .filter((item) => item.drugName)
          .sort((a, b) =>
            [a.drugName, a.strength, a.form, a.lot, a.expiryDate, a.unit, a.qty]
              .join("|")
              .localeCompare([b.drugName, b.strength, b.form, b.lot, b.expiryDate, b.unit, b.qty].join("|")),
          );
      }

      function printInspectionBoxes_(boxes, cfg) {
        const cols = Number(cfg.cols || 2),
          height = Number(cfg.height || 72),
          margin = Number(cfg.margin || 10),
          border = Number(cfg.border || 1),
          gap = Number(cfg.gap || 6),
          radius = Number(cfg.radius || 0),
          textRows = cfg.textRows || defaultInspectionTextRows_();
        byId("inspectionPrintArea").innerHTML =
          `<div class="inspection-sheet" style="--label-cols:${cols}; --label-height:${height}mm; --a4-margin:${margin}mm; --label-border-width:${border}px; --label-gap:${gap}mm; --label-radius:${radius}mm">${boxes.map((box) => renderInspectionLabel(box, textRows)).join("")}</div>`;
        byId("inspectionPrintArea").classList.remove("hidden");
        window.print();
        setTimeout(
          () => byId("inspectionPrintArea").classList.add("hidden"),
          400,
        );
      }

      function renderInspectionLabel(box, textRows) {
        const settings = state.data.settings || {};
        const rows =
          textRows && textRows.length ? textRows : defaultInspectionTextRows_();
        return `<section class="inspection-label">${rows.map((row) => renderInspectionPrintLine(box, settings, row)).join("")}</section>`;
      }

      function renderInspectionPrintLine(box, settings, row) {
        const text = applyInspectionTemplate(row.text, box, settings);
        const size = Math.min(72, Math.max(6, Number(row.size || 12)));
        const align = ["left", "center", "right"].includes(row.align)
          ? row.align
          : "left";
        const weight = row.bold ? "700" : "400";
        return `<div class="inspection-print-line" style="font-size:${size}pt; text-align:${align}; font-weight:${weight}">${esc(text)}</div>`;
      }

      function applyInspectionTemplate(text, box, settings) {
        const map = {
          hospital: settings.HOSPITAL_NAME || "โรงพยาบาล",
          title: "ใบนัดตรวจกล่องยาฉุกเฉิน",
          date: formatThaiDateBE(box.inspectionDate),
          boxCode: box.boxCode || "-",
          location: box.location || "-",
          kitName: box.kitName || "-",
          note: box.inspectionNote || "-",
        };
        return String(text || "").replace(/\{(\w+)\}/g, (all, key) =>
          map[key] === undefined ? all : map[key],
        );
      }

            savedSettings.APP_CREDIT_TEXT || "Developed by Natee I.,Pharm D.";
          if (payload.APP_CREDIT_TEXT !== currentCredit && creditEditPin !== "2222") {
            return toast("ไม่สามารถแก้ไข Credit ได้");
          }
          await server(
            "apiSaveSettings",
            state.token,
            payload,
            creditEditPin,
          );
          settingsPreview = null;
          creditEditUnlocked = false;
          creditEditPin = "";
          if (state.data) state.data.settings = payload;
          applyThemeSettings();
          updateBrand_();
          updateDocumentTitle_();

      function getDrugRecordPrintSettings_() {
        const defaults = defaultDrugRecordPrintSettings_();
        try {
          const saved = JSON.parse(localStorage.getItem(DRUG_RECORD_PRINT_SETTINGS_KEY) || "{}");
          const paper = ["label", "a4", "custom"].includes(saved.paper) ? saved.paper : defaults.paper;
          const cfg = { ...defaults, ...saved, paper };
          if (cfg.paper === "label") {
            cfg.width = 130;
            cfg.height = 50;
          } else if (cfg.paper === "a4") {
            cfg.width = 210;
            cfg.height = 297;
          } else {
            cfg.width = Number(cfg.width || defaults.width);
            cfg.height = Number(cfg.height || defaults.height);
          }
          return cfg;
        } catch (err) {
          return defaults;
        }
      }

      function drugRecordPrintCss_() {

-record-sheet.is-label-13x5 .drug-record-meta{font-size:6.5pt;line-height:1.15}.drug-record-sheet.is-label-13x5 .drug-record-table{font-size:6.55pt}.drug-record-sheet.is-label-13x5 .drug-record-table th,.drug-record-sheet.is-label-13x5 .drug-record-table td{height:4.25mm;padding:.35mm .75mm}.drug-record-sheet.is-label-13x5 .drug-record-note,.drug-record-sheet.is-label-13x5 .drug-record-foot{font-size:6.35pt}`;

      function normalizeDrugPrintConfig_(cfg) {
        const out = {
          paper: cfg.paper || "label",
          width: Number(cfg.width || 130),
          height: Number(cfg.height || 50),
        };
        if (!["label", "a4", "custom"].includes(out.paper)) out.paper = "label";
        return out;
      }

      function drugPrintContentSize_(cfg) {
        if (cfg.paper === "a4") return { width: 194, height: 132 };
        if (cfg.paper === "custom") return { width: cfg.width || 130, height: cfg.height || 50 };
        return { width: 130, height: 50 };
      }

      function isDrugPrintLabel13x5_(size) {
        return Math.round(Number(size.width || 0)) === 130 && Math.round(Number(size.height || 0)) === 50;
      }

      function buildDrugPrintRows_(items) {
        const groups = [];
        const map = new Map();
        (items || []).map(normalizeDrugPrintItem_).forEach((item) => {
          if (!item.drugName) return;
          const key = [item.drugName || "", item.strength || "", item.form || "", item.unit || ""].join("\u001f");
          let group = map.get(key);
          if (!group) {
            group = {
              name: [item.drugName, item.strength].filter(Boolean).join(" "),
              totalQty: 0,
              lots: [],
            };
            map.set(key, group);
            groups.push(group);
          }
          const qty = Number(item.qty || 0);
          group.totalQty += qty;
          group.lots.push({ lot: item.lot || "", expiryDate: item.expiryDate || "", qty });
        });
        return groups.flatMap((group) => {
          const lots = group.lots.length ? group.lots : [{}];
          return lots.map((lot, idx) => ({
            name: idx === 0 ? group.name : "",
            qty: idx === 0 ? group.totalQty : "",
            lot: lot.lot || "",
            lotQty: lot.qty,
            expiryDate: lot.expiryDate || "",
          }));
        });
      }

      function normalizeDrugPrintItem_(item) {
        if (!item || !looksLikeDrugPrintDate_(item.qty)) return item || {};
        return {
          ...item,
          form: item.lot || "",
          lot: item.expiryDate || "",
          expiryDate: item.qty || "",
          qty: item.unit || 0,
          unit: item.sortOrder || "",
          sortOrder: item.requiredQty || "",
          requiredQty: item.form || item.unit || 0,
        };
      }

      function looksLikeDrugPrintDate_(value) {
        return typeof value === "string" && /^\d{4}-\d{2}-\d{2}/.test(value);
      }

      function renderDrugPrintCards_(rows, data, cfg, size) {
        const isLabel13x5 = isDrugPrintLabel13x5_(size);
        const pages = paginateDrugPrintRows_(rows, isLabel13x5);
        return pages.map((page, idx) => renderDrugPrintCard_(page, data, idx, pages.length, isLabel13x5)).join("");
      }

      function paginateDrugPrintRows_(rows, isLabel13x5) {
        const items = rows || [];
        if (!isLabel13x5) {
          return [{ rows: items.slice(), rowCount: Math.max(1, items.length), hasFooter: true }];
        }
        const rowsWithoutFooter = 7;
        const rowsWithFooter = 6;
        const pages = [];
        if (items.length <= rowsWithFooter) {
          return [{ rows: items.slice(), rowCount: rowsWithFooter, hasFooter: true }];
        }
        let cursor = 0;
        while (items.length - cursor > rowsWithFooter) {
          pages.push({ rows: items.slice(cursor, cursor + rowsWithoutFooter), rowCount: rowsWithoutFooter, hasFooter: false });
          cursor += rowsWithoutFooter;
        }
        pages.push({ rows: items.slice(cursor), rowCount: rowsWithFooter, hasFooter: true });
        return pages;
      }

      function renderDrugPrintCard_(page, data, index, total, hidePageText) {
        const pageText = !hidePageText && total > 1 ? "<br>หน้า " + (index + 1) + "/" + total : "";
        const footer = page.hasFooter
          ? '<div class="drug-record-note">* ยาใกล้หมดอายุ (&lt;1 เดือน)</div><div class="drug-record-foot"><div>เวลา: ' + esc(data.time || "") + '</div><div>ผู้ตรวจ: __________________</div></div>'
          : "";
        return '<section class="drug-record-card"><header class="drug-record-head"><div><div class="drug-record-title">' + esc(data.boxCode || "") + '</div><div class="drug-record-location">' + esc(data.location || "-") + '</div></div><div class="drug-record-meta"><b>วันที่: ' + esc(data.inspectionDate || "") + "</b><br>ผู้ตรวจ: " + esc(data.inspector || "________________") + pageText + "</div></header>" + renderDrugPrintTable_(page.rows, page.rowCount) + footer + "</section>";
      }

      function renderDrugPrintTable_(items, rowCount) {
        const rows = (items || []).map(renderDrugPrintRow_);
        while (rows.length < rowCount) rows.push(renderDrugPrintRow_({}));
        return '<table class="drug-record-table"><colgroup><col style="width:54%"><col style="width:10%"><col style="width:18%"><col style="width:18%"></colgroup><thead><tr><th>ยา</th><th>จำนวน</th><th>Lot</th><th>Exp</th></tr></thead><tbody>' + rows.join("") + "</tbody></table>";
      }

      function renderDrugPrintRow_(item) {
        item = item || {};
        const expiring = isWithinOneMonth(item.expiryDate);
        return "<tr><td>" + esc(item.name || "") + '</td><td class="drug-record-center">' + (item.qty === undefined ? "" : esc(item.qty)) + '</td><td class="drug-record-center">' + esc(drugPrintLotWithQtyText_(item.lot, item.lotQty)) + '</td><td class="drug-record-center ' + (expiring ? "drug-record-expiring" : "") + '">' + esc(formatShortDateBE(item.expiryDate)) + (expiring ? "*" : "") + "</td></tr>";
      }

      function drugPrintLotWithQtyText_(lotValue, qtyValue) {
        const lot = String(lotValue || "").trim();
        const hasQty = qtyValue !== undefined && qtyValue !== null && String(qtyValue).trim() !== "";
        return lot ? lot + (hasQty ? " (" + qtyValue + ")" : "") : "";
      }

      function lotWithQtyText_(item) {
        const lot = String((item && item.lot) || "").trim();
        const qty = item ? item.qty : "";
        const hasQty = qty !== undefined && qty !== null && String(qty).trim() !== "";
        return lot ? lot + (hasQty ? " (" + qty + ")" : "") : "";
      }

        q.scores.forEach(
          (row) => (payload.scores[row[0]] = fd.get(row[0]) || ""),

        q.comparisons.forEach(
          (row) => (payload.comparisons[row[0]] = fd.get(row[0]) || ""),

      function downloadHtmlDoc_(filename, html) {
        const blob = new Blob([html], {
          type: "application/msword;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function publicMedicineCounts(items) {
        return items.reduce(
          (acc, item) => {
            acc[publicMedicineState(item)] += 1;
            return acc;
          },
          { expired: 0, expiring: 0, ready: 0 },
        );
      }
      function publicMedicineState(item) {
        if (item.lots) {
          const states = item.lots.map(publicMedicineState);
          if (states.includes("expired")) return "expired";
          if (states.includes("expiring")) return "expiring";
          return "ready";
        }
        if (!item.expiryDate) return "ready";
        const d = new Date(item.expiryDate);
        if (isNaN(d)) return "ready";
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        if (d < today) return "expired";
        return isWithinOneMonth(item.expiryDate) ? "expiring" : "ready";
      }
      function groupPublicMedicineItems(items) {
        const groups = new Map();
        items.forEach((item) => {
          const key = [
            item.drugName || "",
            item.strength || "",
            item.unit || "",
          ].join("\u0001");
          if (!groups.has(key)) {
            groups.set(key, {
              drugName: item.drugName || "-",
              strength: item.strength || "",
              unit: item.unit || "",
              qty: 0,
              lots: [],
            });
          }
          const group = groups.get(key);
          const qty = Number(item.qty || 0);
          group.qty += isNaN(qty) ? 0 : qty;
          group.lots.push({
            lot: item.lot || "-",
            expiryDate: item.expiryDate || "",
            qty: item.qty || 0,
            unit: item.unit || group.unit || "",
          });
        });
        return [...groups.values()];
      }

        document
