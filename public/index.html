      function updateBoxQtyStatus(group) {
        if (!group) return;
        const total = Number(mainValue_(group, "totalQty") || 0);
        const used = lotRowsForGroup_(group).reduce(
          (sum, lot) => sum + Number(lot.qty || 0),
          0,
        );
        const remaining = total - used;
        const summary = group.querySelector(".box-lot-summary");
        if (!summary) return;
        if (!total) {
          summary.textContent = "รวม Lot: " + used;
          summary.className = "box-lot-summary";
        } else if (remaining > 0) {
          summary.textContent = "คงเหลือ " + remaining + " จากจำนวนรวม " + total;
          summary.className = "box-lot-summary";
        } else if (remaining === 0) {
          summary.textContent = "ครบจำนวน " + total;
          summary.className = "box-lot-summary ok";
        } else {
          summary.textContent = "เกินจำนวนรวม " + Math.abs(remaining);
          summary.className = "box-lot-summary bad";
        }
      }

      function validateBoxItemsComplete() {
        updateAllBoxQtyStatus();
        const invalid = [...document.querySelectorAll("#boxItems .box-item-group")].filter(
          (group) => {
            const name = mainValue_(group, "drugName");
            const total = Number(mainValue_(group, "totalQty") || 0);
            const used = lotRowsForGroup_(group).reduce(
              (sum, lot) => sum + Number(lot.qty || 0),
              0,
            );
            return name && total > 0 && used !== total;
          },
        );
        if (invalid.length) {
          toast("ยังบันทึกไม่ได้: จำนวนใน Lot รวมต้องเท่ากับจำนวนรวมของรายการยา");
          return false;
        }
        return true;
      }

      function collectBoxItems() {
        return [...byId("boxItems").querySelectorAll(".box-item-group")]
          .flatMap((group) => {
            const drugName = mainValue_(group, "drugName");
            if (!drugName) return [];
            const totalQty = Number(mainValue_(group, "totalQty") || 0);
            const base = {
              drugName,
              strength: mainValue_(group, "strength"),
              form: mainValue_(group, "form"),
              unit: mainValue_(group, "unit"),
              requiredQty: totalQty,
            };
            return lotRowsForGroup_(group).map((lot) => ({
              ...base,
              lot: lot.lot || "",
              expiryDate: lot.expiryDate || "",
              qty: lot.qty || 0,
              requiredQty: lot.qty || 0,
            }));
          })
          .filter((item) => item.drugName);
      }

      function renderExpiringTable(items) {
        const rows = items
          .map(
            (item) =>
              `<tr><td>${esc(item.box ? item.box.boxCode : "-")}</td><td>${esc(item.drugName)}<br><span class="muted">${esc(item.strength || "")}</span></td><td>${esc(item.lot || "-")}</td><td>${esc(formatDate(item.expiryDate))}</td><td>${esc(item.qty)} ${esc(item.unit || "")}</td></tr>`,
          )
          .join("");
        return `<table><thead><tr><th>กล่อง</th><th>ยา</th><th>Lot</th><th>หมดอายุ</th><th>จำนวน</th></tr></thead><tbody>${rows || emptyRow(5)}</tbody></table>`;
      }
      function renderEventsTable(events) {
        const rows = events
          .map(
            (ev) =>
              `<tr><td>${esc(ev.boxCode)}</td><td>${esc(formatDateTime(ev.openedAt))}</td><td>${esc(ev.hn || "-")}</td><td>${esc(ev.openedBy || "-")}</td><td>${esc(ev.department || "-")}</td><td>${esc(ev.reason || "-")}</td></tr>`,
          )
          .join("");
        return `<table><thead><tr><th>กล่อง</th><th>เวลา</th><th>HN</th><th>ผู้เปิด</th><th>หน่วยงาน</th><th>เหตุผล</th></tr></thead><tbody>${rows || emptyRow(6)}</tbody></table>`;
      }
      function modal(title, html) {
        byId("modalRoot").classList.remove("hidden");
        byId("modalRoot").innerHTML =
          `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="secondary" onclick="closeModal()">ปิด</button></div>${html}</div></div>`;
      }
      function appAlert_(title, message, options = {}) {
        return appDialog_({
          title,
          message,
          confirmText: options.confirmText || "ตกลง",
          showCancel: false,
        });
      }
      function appConfirm_(title, message, options = {}) {
        return appDialog_({
          title,
          message,
          confirmText: options.confirmText || "ยืนยัน",
          cancelText: options.cancelText || "ยกเลิก",
          showCancel: true,
          danger: !!options.danger,
        });
      }
      function appPrompt_(title, message, options = {}) {
        return appDialog_({
          title,
          message,
          confirmText: options.confirmText || "ตกลง",
          cancelText: options.cancelText || "ยกเลิก",
          showCancel: true,
          inputType: options.inputType || "text",
          inputValue: options.inputValue || "",
        });
      }
      function boxChangeReasonDialog_() {
        return new Promise((resolve) => {
          const root = document.createElement("div");
          root.className = "app-dialog-root";
          root.innerHTML =
            `<div class="modal-backdrop" style="z-index:30"><div class="modal app-dialog"><div class="sweet-icon">${iconSvg_("edit")}</div><h2>เหตุผลการบันทึกกล่อง</h2><p class="app-dialog-message">มีการเปลี่ยนแปลงข้อมูลในกล่อง กรุณาเลือกเหตุผลก่อนบันทึก</p><div class="sweet-form"><label>เหตุผล<select id="boxChangeReason"><option value="ตรวจเช็คกล่องรายเดือน">ตรวจเช็คกล่องรายเดือน</option><option value="เติมยาหลังเปิดใช้">เติมยาหลังเปิดใช้</option><option value="อื่นๆ">อื่นๆ</option></select></label><label id="boxChangeOtherWrap" class="hidden">ระบุเหตุผล<input id="boxChangeOther" type="text"></label></div><div class="actions"><button class="secondary" id="boxReasonCancel" type="button">ยกเลิก</button><button id="boxReasonOk" type="button">บันทึก</button></div></div></div>`;
          document.body.appendChild(root);
          const reasonSelect = root.querySelector("#boxChangeReason");
          const otherWrap = root.querySelector("#boxChangeOtherWrap");
          const otherInput = root.querySelector("#boxChangeOther");
          const updateOther = () => otherWrap.classList.toggle("hidden", reasonSelect.value !== "อื่นๆ");
          const cleanup = (value) => {
            document.removeEventListener("keydown", onKey);
            root.remove();
            resolve(value);
          };
          const accept = () => {
            const reason = reasonSelect.value === "อื่นๆ" ? otherInput.value.trim() : reasonSelect.value;
            if (!reason) return toast("กรุณาระบุเหตุผล");
            cleanup(reason);
          };
          const cancel = () => cleanup(null);
          const onKey = (event) => {
            if (event.key === "Escape") cancel();
            if (event.key === "Enter") {
              event.preventDefault();
              accept();
            }
          };
          reasonSelect.addEventListener("change", updateOther);
          root.querySelector("#boxReasonOk").addEventListener("click", accept);
          root.querySelector("#boxReasonCancel").addEventListener("click", cancel);
          document.addEventListener("keydown", onKey);
          setTimeout(() => reasonSelect.focus(), 0);
        });
      }
      function appDialog_(options) {
        return new Promise((resolve) => {
          const root = document.createElement("div");
          const hasInput = !!options.inputType;
          const messageHtml = options.message
            ? `<p class="app-dialog-message">${esc(options.message).replace(/\n/g, "<br>")}</p>`
            : "";
          const inputHtml = hasInput
            ? `<label class="app-dialog-input">รหัสยืนยัน<input id="appDialogInput" type="${attr(options.inputType)}" value="${attr(options.inputValue || "")}"></label>`
            : "";
          root.className = "app-dialog-root";
          root.innerHTML =
            `<div class="modal-backdrop" style="z-index:30"><div class="modal app-dialog"><div class="sweet-icon">${iconSvg_("power")}</div><h2>${esc(options.title || "ยืนยัน")}</h2>${messageHtml}${inputHtml}<div class="actions">${options.showCancel ? `<button class="secondary" id="appDialogCancel" type="button">${esc(options.cancelText || "ยกเลิก")}</button>` : ""}<button class="${options.danger ? "danger" : ""}" id="appDialogOk" type="button">${esc(options.confirmText || "ตกลง")}</button></div></div></div>`;
          document.body.appendChild(root);
          const cleanup = (value) => {
            document.removeEventListener("keydown", onKey);
            root.remove();
            resolve(value);
          };
          const acceptDialog = () => cleanup(hasInput ? byId("appDialogInput").value : true);
          const cancel = () => cleanup(hasInput ? null : false);
          const onKey = (event) => {
            if (event.key === "Escape") cancel();
            if (event.key === "Enter") {
              event.preventDefault();
              acceptDialog();
            }
          };
          byId("appDialogOk").addEventListener("click", acceptDialog);
          const cancelButton = byId("appDialogCancel");
          if (cancelButton) cancelButton.addEventListener("click", cancel);
          document.addEventListener("keydown", onKey);
          setTimeout(() => {
            const focusTarget = hasInput ? byId("appDialogInput") : byId("appDialogOk");
            if (focusTarget) focusTarget.focus();
          }, 0);
        });
      }
      function closeModal() {
        byId("modalRoot").classList.add("hidden");
        byId("modalRoot").innerHTML = "";
      }
      function statusPill(status) {
        const cls =
          status === "พร้อมใช้"
            ? "ok"
            : status === "เปิดใช้งานแล้ว"
              ? "bad"
              : "warn";
        return `<span class="pill ${cls}">${esc(status || "-")}</span>`;
      }
      function stat(label, value, variant, icon, unit) {
        return `<div class="stat ${attr(variant || "blue")}"><div class="stat-icon">${esc(icon || "•")}</div><span>${esc(label)}</span><b>${esc(value || 0)}</b><small>${esc(unit || "")}</small></div>`;
      }
      function emptyRow(cols) {
        return `<tr><td colspan="${cols}" class="muted">ยังไม่มีข้อมูล</td></tr>`;
      }
      function qrImg(text, size) {
        return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}`;
      }
      function userDisplayText(user) {
        if (!user) return "";
        if (user.displayText) return user.displayText;
        const name = user.displayName || user.username || "";
        return user.position ? `${name}, ${user.position}` : name;
      }
      function roleLabel(role) {
        return role === "admin" ? "Admin" : "User";
      }
      function byId(id) {
        return document.getElementById(id);
      }
      function val(id) {
        return byId(id) ? byId(id).value.trim() : "";
      }
      function esc(v) {
        return String(v ?? "").replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[ch],
        );
      }
      function attr(v) {
        return esc(v);
      }
      function iconSvg_(name) {
        const icons = {
          edit: '<path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>',
          qr: '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h2v2h-2zM19 14h2v2h-2zM14 19h2v2h-2zM18 18h3v3"></path>',
          calendar: '<path d="M8 2v4M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path>',
          print: '<path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v8H6z"></path>',
          rename: '<path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path>',
          file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path><path d="M14 2v6h6"></path><path d="M8 13h8M8 17h6"></path>',
          copy: '<rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>',
          activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>',
          power: '<path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path>',
          trash: '<path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path>',
        };
        return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.edit}</svg>`;
      }
      function actionButton_(icon, label, onclick, variant = "") {
        return `<button class="icon-btn ${variant}" type="button" title="${attr(label)}" aria-label="${attr(label)}" onclick="${attr(onclick)}">${iconSvg_(icon)}</button>`;
      }
      function formatDate(v) {
        if (!v) return "-";
        const d = new Date(v);
        return isNaN(d)
          ? String(v).slice(0, 10)
          : d.toLocaleDateString("th-TH", {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            });
      }
      function formatThaiDateBE(v) {
        if (!v) return "-";
        const d = new Date(v);
        if (isNaN(d)) return String(v);
        return d.toLocaleDateString("th-TH-u-ca-buddhist", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        });
      }
      function formatShortDateBE(v) {
        if (!v) return "";
        const d = new Date(v);
        if (isNaN(d)) return String(v).slice(0, 10);
        return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear() + 543}`;
      }
      function currentTimeText() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }
      function isWithinOneMonth(v) {
        if (!v) return false;
        const d = new Date(v);
        if (isNaN(d)) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const limit = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
        return d >= today && d <= limit;
      }
      function daysUntil_(v) {
        if (!v) return 9999;
        const d = new Date(v);
        if (isNaN(d)) return 9999;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        d.setHours(0, 0, 0, 0);
        return Math.ceil((d.getTime() - today.getTime()) / (24 * 60 * 60 * 1000));
      }
      function expiryDaysText_(days) {
        if (days < 0) return "หมดอายุแล้ว";
        if (days === 0) return "วันนี้";
        return "เหลือ " + days + " วัน";
      }
      function formatDateTime(v) {
        if (!v) return "-";
        const d = new Date(v);
        return isNaN(d) ? v : d.toLocaleString("th-TH");
      }
      function toInputDate(v) {
        if (!v) return "";
        const d = new Date(v);
        if (isNaN(d)) return String(v).slice(0, 10);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function toast(message) {
        byId("toast").textContent = message;
        byId("toast").classList.remove("hidden");
        setTimeout(() => byId("toast").classList.add("hidden"), 3600);
      }
    </script>
  </body>
</html>
