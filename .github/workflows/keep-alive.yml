name: Keep Supabase Alive
on:
  schedule:
    - cron: "0 0 * * *" # ระบบจะยิง Request ปลุกฐานข้อมูลให้ทุกวัน
  workflow_dispatch: # ปุ่มสำหรับกดทดสอบรันด้วยตัวเอง (Manual)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project
        run: |
          curl -fsS -X POST "${{ vars.SEB_SUPABASE_URL }}/functions/v1/api" \
          -H "content-type: application/json" \
          -H "apikey: ${{ secrets.SEB_SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SEB_SUPABASE_ANON_KEY }}" \
          -d '{"action":"apiHealth","args":[]}'
